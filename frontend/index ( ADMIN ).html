<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Admin Panel — SMK Negeri 24 Jakarta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#00142f',
          'primary-container': '#0f294a',
          secondary: '#855300',
          'secondary-container': '#fea619',
          'on-secondary-container': '#4a2e00',
          surface: '#f8f9ff',
          'surface-container-lowest': '#ffffff',
          'surface-container-low': '#eff4ff',
          'surface-container': '#e5eeff',
          'surface-container-high': '#dce9ff',
          'on-surface': '#0b1c30',
          'on-surface-variant': '#44474e',
          outline: '#c4c6cf',
          error: '#ba1a1a',
          'error-container': '#ffdad6',
        },
        fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #c4c6cf; border-radius: 999px; }
  .nav-item.active { background: #0f294a; color: #fff; }
  .nav-item.active .material-symbols-outlined { color: #fea619; }
  [x-cloak] { display: none !important; }
  .modal-backdrop { background: rgba(11,28,48,0.55); }
</style>
</head>
<body class="bg-surface text-on-surface antialiased">

<!-- ======================= LAYAR LOGIN ======================= -->
<div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-primary text-secondary-container flex items-center justify-center mx-auto mb-3 font-bold text-xl shadow-lg">24</div>
      <h1 class="text-lg font-bold text-primary">Admin Panel</h1>
      <p class="text-sm text-on-surface-variant">SMK Negeri 24 Jakarta</p>
    </div>
    <form id="login-form" class="bg-white border border-surface-container rounded-2xl shadow-sm p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-primary mb-1">Username</label>
        <input id="login-username" type="text" required autocomplete="username"
          class="w-full text-sm rounded-xl border border-surface-container bg-surface-container-low px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-secondary-container" />
      </div>
      <div>
        <label class="block text-xs font-bold text-primary mb-1">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password"
          class="w-full text-sm rounded-xl border border-surface-container bg-surface-container-low px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-secondary-container" />
      </div>
      <p id="login-error" class="hidden text-xs font-semibold text-error bg-error-container rounded-lg px-3 py-2"></p>
      <button type="submit" id="login-submit"
        class="w-full py-2.5 rounded-xl bg-primary text-white font-bold text-sm hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
        <span>Masuk</span>
        <span class="material-symbols-outlined text-[18px]">login</span>
      </button>
      <p class="text-[11px] text-center text-on-surface-variant">Akun default: <b>admin</b> / <b>admin123</b> — segera ganti setelah login pertama.</p>
    </form>
  </div>
</div>

<!-- ======================= APLIKASI ADMIN ======================= -->
<div id="app-screen" class="hidden min-h-screen lg:flex">

  <!-- Sidebar -->
  <aside class="hidden lg:flex flex-col w-64 shrink-0 bg-primary text-white min-h-screen p-4 gap-1">
    <div class="flex items-center gap-2 px-2 py-3 mb-2">
      <div class="w-9 h-9 rounded-xl bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-sm">24</div>
      <div>
        <p class="font-bold text-sm leading-tight">SMKN 24 Jakarta</p>
        <p class="text-[11px] text-white/60 leading-tight">Admin Panel</p>
      </div>
    </div>
    <nav id="sidebar-nav" class="flex flex-col gap-1 text-sm font-semibold"></nav>
    <div class="mt-auto pt-3 border-t border-white/10">
      <button onclick="App.logout()" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-white/80 hover:bg-white/10 text-sm font-semibold">
        <span class="material-symbols-outlined text-[20px]">logout</span> Keluar
      </button>
    </div>
  </aside>

  <!-- Mobile topbar + nav -->
  <div class="lg:hidden bg-primary text-white p-3 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-xs">24</div>
      <span class="font-bold text-sm">Admin Panel</span>
    </div>
    <button onclick="document.getElementById('mobile-nav').classList.toggle('hidden')" class="p-1.5">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </div>
  <div id="mobile-nav" class="hidden lg:hidden bg-primary-container text-white px-3 pb-3">
    <nav id="sidebar-nav-mobile" class="flex flex-col gap-1 text-sm font-semibold"></nav>
    <button onclick="App.logout()" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-white/80 hover:bg-white/10 text-sm font-semibold mt-1">
      <span class="material-symbols-outlined text-[20px]">logout</span> Keluar
    </button>
  </div>

  <!-- Konten utama -->
  <main class="flex-1 min-h-screen">
    <header class="hidden lg:flex items-center justify-between px-8 py-5 border-b border-surface-container bg-white sticky top-0 z-20">
      <div>
        <h1 id="page-title" class="text-xl font-bold text-primary">Dashboard</h1>
        <p id="page-subtitle" class="text-xs text-on-surface-variant">Ringkasan konten website</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="admin-name" class="text-sm font-semibold text-primary"></span>
        <div class="w-9 h-9 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-sm">A</div>
      </div>
    </header>

    <div id="toast" class="hidden fixed top-4 right-4 z-[100] px-4 py-3 rounded-xl shadow-lg text-sm font-semibold text-white"></div>

    <div id="view-root" class="p-4 lg:p-8"></div>
  </main>
</div>

<!-- Modal generik untuk form tambah/edit -->
<div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl max-h-[92vh] overflow-y-auto shadow-2xl">
    <div class="flex items-center justify-between px-5 py-4 border-b border-surface-container sticky top-0 bg-white z-10">
      <h3 id="modal-title" class="font-bold text-primary">Judul</h3>
      <button onclick="App.closeModal()" class="p-1 rounded-full hover:bg-surface-container-low">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="modal-form" class="p-5 space-y-4"></form>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
