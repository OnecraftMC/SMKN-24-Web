<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Dynamic Shifting Linear Gradient -->
    <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4; #6366F1; #EC4899; #10B981; #06B6D4" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6; #EC4899; #10B981; #06B6D4; #8B5CF6" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899; #10B981; #06B6D4; #6366F1; #EC4899" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle Glass Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter for High Tech Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-card {
      fill: url(#bg-gradient);
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1.5px;
      rx: 20px;
    }

    .main-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 76px;
      letter-spacing: 8px;
      fill: url(#neon-gradient);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .bracket {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 54px;
      fill: #38BDF8;
      opacity: 0.8;
      animation: floatBracket 3s ease-in-out infinite alternate;
    }

    .bracket-left {
      animation-delay: 0s;
    }

    .bracket-right {
      animation-delay: 1.5s;
    }

    .sub-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 5px;
      fill: #94A3B8;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .dot-accent {
      fill: #38BDF8;
      opacity: 0.4;
      animation: pulseDot 2s ease-in-out infinite alternate;
    }

    @keyframes floatBracket {
      0% { transform: translateY(0px); opacity: 0.5; }
      100% { transform: translateY(-8px); opacity: 1; }
    }

    @keyframes pulseDot {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.2); }
    }
  </style>

  <!-- Container / Frame Glass Card -->
  <rect x="15" y="15" width="770" height="190" class="bg-card" />

  <!-- Decorative Tech Dots Grid -->
  <g class="dot-accent">
    <circle cx="50" cy="45" r="2" />
    <circle cx="65" cy="45" r="2" />
    <circle cx="80" cy="45" r="2" />
    <circle cx="50" cy="60" r="2" />
    <circle cx="65" cy="60" r="2" />
    
    <circle cx="720" cy="160" r="2" />
    <circle cx="735" cy="160" r="2" />
    <circle cx="750" cy="160" r="2" />
    <circle cx="735" cy="175" r="2" />
    <circle cx="750" cy="175" r="2" />
  </g>

  <!-- Animated Code Brackets < /> -->
  <g transform="translate(100, 105)">
    <text class="bracket bracket-left" text-anchor="middle"><</text>
  </g>
  <g transform="translate(700, 105)">
    <text class="bracket bracket-right" text-anchor="middle">/></text>
  </g>

  <!-- Main Animated Text -->
  <g transform="translate(400, 95)">
    <!-- Ambient Glow Layer -->
    <text class="main-text" filter="url(#neon-glow)" opacity="0.5">FRONTEND</text>
    <!-- Sharp Foreground Text -->
    <text class="main-text">FRONTEND</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 155)">
    <text class="sub-text">ENGINEERING & INTERFACE ARCHITECTURE</text>
  </g>
</svg>
